version: "3"

services:
  infisical:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: infisical/infisical:latest # PIN THIS TO A SPECIFIC TAG
    pull_policy: always
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgres://infisical:${INFISICAL_POSTGRES_PASSWORD}@db:5432/infisical"
      REDIS_URL: "redis://redis:6379"
      SITE_URL: "https://infisical.hayden.moe"
      INF_APP_CONNECTION_GITHUB_OAUTH_CLIENT_ID: ""
      INF_APP_CONNECTION_GITHUB_OAUTH_CLIENT_SECRET: ""
      INF_APP_CONNECTION_GITHUB_APP_CLIENT_ID: ""
      INF_APP_CONNECTION_GITHUB_APP_CLIENT_SECRET: ""
      INF_APP_CONNECTION_GITHUB_APP_PRIVATE_KEY: ""
      INF_APP_CONNECTION_GITHUB_APP_SLUG: ""
      INF_APP_CONNECTION_GITHUB_APP_ID: ""
      KUBERNETES_AUTO_FETCH_SERVICE_ACCOUNT_TOKEN: "false"
    expose:
      - "8080"
    ports:
      - "18080:8080"
    networks:
      - default
      - infisical

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: infisical-dev-redis
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: 'yes'
    networks:
      - infisical
    volumes:
      - infisical_redis_data:/data

  db:
    container_name: infisical-db
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: always
    environment:
      POSTGRES_PASSWORD: "${INFISICAL_POSTGRES_PASSWORD}"
      POSTGRES_USER: "infisical"
      POSTGRES_DB: "infisical"
    volumes:
      - infisical_pg_data:/var/lib/postgresql/18/docker
    networks:
      - infisical

volumes:
  infisical_pg_data:
    driver: local
  infisical_redis_data:
    driver: local

networks:
  default:
    name: edge
    external: true

  infisical:
