---
secrets:
  1pw_token:
    file: /opt/doco-cd/1pw_token
  api_secret:
    file: /opt/doco-cd/api_secret
  webhook_secret:
    file: /opt/doco-cd/webhook_secret

services:
  app:
    container_name: doco-cd
    environment:
      API_SECRET_FILE: /run/secrets/api_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      DEPLOY_CONFIG_BASE_DIR: ./docker/vps/
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://git.hayden.moe/hayden/phoebe.git
          reference: main
          interval: 3600
      SECRET_PROVIDER: 1password
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/1pw_token
      TZ: Europe/London
    ports:
      - "8080:80"
      - "9120:9120"
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
    image: ghcr.io/kimdre/doco-cd:0.122.0@sha256:c301a4ebe864be8e73103015d20c84784e3ced9f4f65e0f28baf71e2c350bb18
    restart: unless-stopped
    secrets:
      - 1pw_token
      - api_secret
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

volumes:
  data: {}

networks:
  default:
    name: edge
    external: true
