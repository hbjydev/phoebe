version: "3"

services:
  openbao:
    restart: unless-stopped
    container_name: openbao
    image: ghcr.io/openbao/openbao-ubi:2.7.2@sha256:822755226a0796a2ec18a395083c92e5ad57f49bf3ce4180a413b2361fac5c22
    pull_policy: always
    environment:
      VAULT_ADDR: https://openbao.hayden.moe
    expose:
      - "8200"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config/openbao.hcl:/openbao/config/openbao.hcl
      - data:/openbao/data

volumes:
  data:

networks:
  default:
    name: edge
    external: true
