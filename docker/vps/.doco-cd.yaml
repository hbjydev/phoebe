  TOWONEL_OPERATOR_KEY: "op://cluster-phoebe/app-towonel/operatorKey"

  INFISICAL_ENCRYPTION_KEY: "op://cluster-phoebe/app-infisical/encryptionKey"
  INFISICAL_AUTH_SECRET: "op://cluster-phoebe/app-infisical/authSecret"
  INFISICAL_POSTGRES_PASSWORD: "op://cluster-phoebe/app-infisical/dbPassword"
