[env]
_.python.venv = { path = "{{ config_root }}/.venv", create = true }
KUBECONFIG = "{{ config_root }}/talos/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{ config_root }}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{ config_root }}/age.key"
TALOSCONFIG = "{{ config_root }}/talos/talosconfig"
JUST_UNSTABLE = "1"

# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
KUBE_VERSION="1.35.2"

# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
TALOS_VERSION="1.12.7"

[settings]
experimental = true
python.uv_venv_auto = true

[tools]
"aqua:FiloSottile/age" = "1.3.1"
"aqua:budimanjojo/talhelper" = "3.1.17"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:fluxcd/flux2" = "2.9.4"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "3.21.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"cargo:minijinja-cli" = "latest"
"pipx:flux-local" = "8.4.0"
gum = "2.0.0"
just = "1.58.0"
talosctl = "1.13.9"
terraform = "1.16.0"
upctl = "3.36.0"
uv = "0.12.6"
yq = "4.53.6"
"aqua:crossplane/crossplane" = "2.4.0"
