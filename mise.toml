[env]
KUBECONFIG = "{{ config_root }}/talos/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{ config_root }}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{ config_root }}/age.key"
TALOSCONFIG = "{{ config_root }}/talos/talosconfig"
JUST_UNSTABLE = "1"
VAULT_ADDR = "https://openbao.hayden.moe"

# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
KUBE_VERSION="1.37.1"

# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
TALOS_VERSION="1.14.4"

[settings]
experimental = true

[tools]
"aqua:FiloSottile/age" = "1.3.2"
"aqua:cilium/cilium-cli" = "0.20.2"
"aqua:fluxcd/flux2" = "2.10.0"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"aqua:kyverno/kyverno" = "1.19.2"
"cargo:minijinja-cli" = "latest"
"pipx:flux-local" = "8.4.0"
gum = "2.0.2"
just = "1.59.0"
talosctl = "1.14.5"
terraform = "1.17.1"
upctl = "3.37.0"
yq = "4.54.1"
"pipx:ansible" = "14.6.0"
"pipx:ansible-core" = "2.22.0"
vals = "0.51.0"
"aqua:postfinance/topf" = "0.6.2"
cmctl = "2.6.2"
node = "26.13.0"
aube = { version = "2.9.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"] }

# kubectl plugins
"github:home-operations/kopiur" = { version = "0.10.17", matching = "kubectl-kopiur_", rename_exe = "kubectl-kopiur" }
"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.1", matching = "kubectl-cnpg_", rename_exe = "kubectl-cnpg" }
"github:kguardian-dev/kguardian" = { version = "1.12.0", version_prefix = "advisor/", rename_exe = "kubectl-kguardian" }
jactionlint = "2.4.0"
shellcheck = "0.11.0"
openbao = "2.7.2"
