---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./dragonfly.yaml
  - ./networkpolicy.yaml
  - ./podmonitor.yaml
  - ./base/ks.yaml
  - ./base/proxy

patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1redis-ready
        value: |-
          {
            "apiVersion": "dragonflydb.io/v1alpha1",
            "kind": "Dragonfly",
            "name": "${REDIS_APP:-${APP}-redis}",
            "namespace": "${NAMESPACE:-default}",
            "expression": "resource.status.phase == 'Ready'"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/redis-ready

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1redis-service
        value: |-
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "${REDIS_APP:-${APP}-redis}",
            "namespace": "${NAMESPACE:-default}"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/redis-service

      - op: add
        path: /spec/values/defaultPodOptions/labels/db.policy.home.arpa~1df-${REDIS_APP:-${APP}-redis}
        value: allow
