---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./dragonfly.yaml
  - ./networkpolicy.yaml
  - ./podmonitor.yaml

patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          defaultPodOptions:
            annotations:
              k8s.ksgate.org/redis-ready: |
                {
                  "apiVersion": "dragonflydb.io/v1alpha1",
                  "kind": "Dragonfly",
                  "name": "${REDIS_APP:-${APP}-redis}",
                  "namespace": "${NAMESPACE:-default}",
                  "expression": "resource.status.phase == 'Ready'"
                }
              k8s.ksgate.org/redis-service: |
                {
                  "apiVersion": "v1",
                  "kind": "Service",
                  "name": "${REDIS_APP:-${APP}-redis}",
                  "namespace": "${NAMESPACE:-default}"
                }
            labels:
              db.policy.home.arpa/df-${REDIS_APP:-${APP}-redis}: allow
            schedulingGates:
              - name: k8s.ksgate.org/redis-ready
              - name: k8s.ksgate.org/redis-service
