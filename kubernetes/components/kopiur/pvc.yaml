---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${APP}"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - "${KOPIUR_ACCESSMODES:=ReadWriteOnce}"

  dataSourceRef:
    kind: Restore
    apiGroup: kopiur.home-operations.com
    name: "${APP}-restore"

  resources:
    requests:
      storage: "${KOPIUR_CAPACITY:=5Gi}"

  storageClassName: "${KOPIUR_STORAGECLASS:=miroir-local}"
