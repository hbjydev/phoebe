---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: ${APP}-users
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  kanidmName: ${OIDC_USERS_GROUP_NAME}
  accountPolicy:
    authSessionExpiry: 2678400
  members: ${OIDC_USERS_GROUP_MEMBERS:=${emptyArray}}
