---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./secret.yaml
  - ../base/ks.yaml
patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1postgres-ready
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "Cluster",
            "name": "postgres",
            "namespace": "database",
            "expression": "resource.status.readyInstances >= 1"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/postgres-ready

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1postgres-service
        value: |-
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "pooler-rw",
            "namespace": "database"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/postgres-service

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1database-applied
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "Database",
            "name": "postgres-${APP}",
            "namespace": "database",
            "expression": "resource.status.applied"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/database-applied

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1database-role-applied
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "DatabaseRole",
            "name": "postgres-${APP}",
            "namespace": "database",
            "expression": "resource.status.applied"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/database-role-applied

      - op: add
        path: /spec/values/defaultPodOptions/labels/db.policy.home.arpa~1postgres
        value: allow

  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          persistence:
            postgres-certs:
              type: custom
              globalMounts:
                - path: /var/run/secrets/postgresql
              volumeSpec:
                csi:
                  driver: csi.cert-manager.io
                  readOnly: true
                  volumeAttributes:
                    csi.cert-manager.io/issuer-name: postgres-client-ca
                    csi.cert-manager.io/issuer-kind: ClusterIssuer
                    csi.cert-manager.io/key-algorithm: ECDSA
                    csi.cert-manager.io/key-size: "384"
                    csi.cert-manager.io/key-encoding: PKCS8
                    csi.cert-manager.io/key-usages: client auth
                    csi.cert-manager.io/common-name: ${DATABASE_OWNER:=${APP}}
                    csi.cert-manager.io/dns-names: $${POD_NAME}.$${POD_NAMESPACE}.svc.cluster.local
            root-ca:
              type: secret
              name: root-ca
              defaultMode: 0440
              globalMounts:
                - path: /var/run/secrets/root-ca
