---
# Database provisioning and readiness gates for workloads managing their own credentials.
# Roles have password login disabled by default.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/component_v1alpha1.json
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./ks.yaml
patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1postgres-ready
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "Cluster",
            "name": "postgres",
            "namespace": "database",
            "expression": "resource.status.readyInstances >= 1"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/postgres-ready

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1postgres-service
        value: |-
          {
            "apiVersion": "v1",
            "kind": "Service",
            "name": "pooler-rw",
            "namespace": "database"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/postgres-service

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1database-applied
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "Database",
            "name": "postgres-${APP}",
            "namespace": "database",
            "expression": "resource.status.applied"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/database-applied

      - op: add
        path: /spec/values/defaultPodOptions/annotations/k8s.ksgate.org~1database-role-applied
        value: |-
          {
            "apiVersion": "postgresql.cnpg.io/v1",
            "kind": "DatabaseRole",
            "name": "postgres-${APP}",
            "namespace": "database",
            "expression": "resource.status.applied"
          }
      - op: add
        path: /spec/values/defaultPodOptions/schedulingGates/-
        value:
          name: k8s.ksgate.org/database-role-applied

      - op: add
        path: /spec/values/defaultPodOptions/labels/db.policy.home.arpa~1postgres
        value: allow
