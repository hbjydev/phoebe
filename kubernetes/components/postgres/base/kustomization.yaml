---
# Database provisioning and readiness gates for workloads managing their own credentials.
# Roles have password login disabled by default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./ks.yaml
patches:
  - target:
      kind: HelmRelease
      group: helm.toolkit.fluxcd.io
      version: v2
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        values:
          defaultPodOptions:
            annotations:
              k8s.ksgate.org/postgres-ready: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Cluster",
                  "name": "postgres",
                  "namespace": "database",
                  "expression": "resource.status.readyInstances >= 1"
                }
              k8s.ksgate.org/postgres-service: |
                {
                  "apiVersion": "v1",
                  "kind": "Service",
                  "name": "pooler-rw",
                  "namespace": "database"
                }
              k8s.ksgate.org/database-applied: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "Database",
                  "name": "postgres-${APP}",
                  "namespace": "database",
                  "expression": "resource.status.applied"
                }
              k8s.ksgate.org/database-role-applied: |
                {
                  "apiVersion": "postgresql.cnpg.io/v1",
                  "kind": "DatabaseRole",
                  "name": "postgres-${APP}",
                  "namespace": "database",
                  "expression": "resource.status.applied"
                }
            labels:
              db.policy.home.arpa/postgres: allow
            schedulingGates:
              - name: k8s.ksgate.org/postgres-ready
              - name: k8s.ksgate.org/postgres-service
              - name: k8s.ksgate.org/database-applied
              - name: k8s.ksgate.org/database-role-applied
