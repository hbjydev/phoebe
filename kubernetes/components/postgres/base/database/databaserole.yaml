---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: postgres-${APP}
  namespace: postgres
spec:
  name: ${OWNER}
  ensure: present
  login: true
  superuser: ${DATABASE_SUPERUSER:=false}
  disablePassword: ${DISABLE_PASSWORD:=true}
  cluster:
    name: postgres
