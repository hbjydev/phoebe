---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
  values:
    fullnameOverride: tuppr
    image:
      tag: 0.5.10
      digest: sha256:38e9ea6280951110a39362a92e910f04d35452bc52096e20d47d5e237d2d9b0c

    monitoring:
      serviceMonitor:
        enabled: true

      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
