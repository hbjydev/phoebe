---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vtsingle-ingress
  annotations:
    tailscale.com/proxy-group: ts-o11y-proxy
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - victoriatraces
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vtsingle-victoria-traces
            port:
              number: 10428
