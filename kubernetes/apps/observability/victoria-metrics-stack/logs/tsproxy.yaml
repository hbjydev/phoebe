---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vlsingle-ingress
  annotations:
    tailscale.com/proxy-group: ts-o11y-proxy
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - victorialogs
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vlsingle-victoria-logs
            port:
              number: 8428
