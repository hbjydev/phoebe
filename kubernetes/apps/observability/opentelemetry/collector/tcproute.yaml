---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/tcproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: talos-tcp
  namespace: observability
  annotations:
    external-dns.kubernetes.io/hostname: otel-collector.hayden.moe
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: talos-tcp
  rules:
    - backendRefs:
        - name: otel-daemonset-collector
          port: 5140
