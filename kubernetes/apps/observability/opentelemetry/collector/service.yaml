---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: otel-syslog-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  type: ClusterIP
  # route preferentially to the local node's collector pod.
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: observability.otel-collector
  ports:
    - name: syslog
      port: 514
      targetPort: 514
      protocol: TCP
