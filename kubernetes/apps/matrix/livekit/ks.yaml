---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app livekit
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: livekit
  components:
    - ../../../../components/redis
  interval: 1h
  path: "./kubernetes/apps/matrix/livekit/app"
  prune: true
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: matrix
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app livekit-jwt-service
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: livekit
      app.kubernetes.io/component: jwt-service
  components:
    - ../../../../components/redis
  interval: 1h
  path: "./kubernetes/apps/matrix/livekit/jwt-service"
  prune: true
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: matrix
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
  timeout: 5m
  wait: false
