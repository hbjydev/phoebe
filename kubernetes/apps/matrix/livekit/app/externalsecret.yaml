# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: livekit-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          port: 7880
          bind_addresses:
            - ""
          redis:
            address: dragonfly.database.svc.cluster.local:6379
            db: 5

          rtc:
            udp_port: 7882
            port_range_start: 50000
            port_range_end: 60000
            ips:
              includes:
                - 172.18.0.0/16
            stun_servers:
              - turn.hayden.moe:3478
            turn_servers:
              - host: turn.hayden.moe
                port: 5349
                protocol: tls
                secret: "{{ .sharedSecret }}"
              - host: turn.hayden.moe
                port: 3478
                protocol: udp
                secret: "{{ .sharedSecret }}"
            use_external_ip: false
            enable_loopback_candidate: false
          room:
            auto_create: true
          turn:
            enabled: false
          log_level: info
          prometheus:
            port: 6789
          keys:
            "{{ .apiKey }}": "{{ .apiSecret }}"
  dataFrom:
    - extract:
        key: app-livekit
    - extract:
        key: app-stunner

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    template:
      data:
        LIVEKIT_KEY: "{{ .apiKey }}"
        LIVEKIT_SECRET: "{{ .apiSecret }}"
  dataFrom:
    - extract:
        key: app-livekit
