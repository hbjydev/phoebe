---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: cluster-roots
        pod:
          labels:
            # Linux .NET uses OpenSSL roots, including SSL_CERT_FILE.
            trust.home.arpa/inject: "true"
            egress.policy.home.arpa/sonarr: allow
            egress.policy.home.arpa/radarr: allow
            egress.policy.home.arpa/lidarr: allow
            ingress.policy.home.arpa/internal: allow
            egress.policy.home.arpa/internet: allow
            egress.policy.home.arpa/sabnzbd: allow
            egress.policy.home.arpa/qbittorrent: allow
            egress.policy.home.arpa/slskd: allow
            db.policy.home.arpa/postgres: allow
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.7.0.5723@sha256:fcf7498692f97698ea8b8f7078a0f81120a16e7354e4c232b5e3810e3e783dff
            env:
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: dark
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__SERVER__PORT: &port 80
              PROWLARR__UPDATE__BRANCH: develop

              # Verify the pooler using the injected SSL_CERT_FILE trust bundle.
              PROWLARR__POSTGRES__MAINDBCONNECTIONSTRING: >-
                Host=pooler-rw.database.svc;
                Database=prowlarr;
                Username=prowlarr;
                SSL Mode=VerifyFull;
                SSL Certificate=/var/run/secrets/postgresql/tls.crt;
                SSL Key=/var/run/secrets/postgresql/tls.key;

              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: prowlarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.hayden.moe"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      postgres-certs:
        type: custom
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-client-ca
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/key-usages: client auth
              csi.cert-manager.io/common-name: prowlarr
              csi.cert-manager.io/fs-group: "1000"
      config:
        existingClaim: prowlarr
      tmp:
        type: emptyDir
