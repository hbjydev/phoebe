# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  metadata:
    annotations:
      reloader.stakater.com/auto: "true"
  discoveryFilters:
    - hayden/*
    - tactica/*
  # renovate: datasource=docker depName=renovate/renovate
  image: renovate/renovate:44.56.4
  imagePullSecrets:
    - name: imp-atcr
    - name: imp-forgejo
  parallelism: 2
  schedule: 0 */12 * * *
  secretRef: forgejo-renovate
  extraEnv:
    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          $schema: "https://docs.renovatebot.com/renovate-schema.json",
          extends: [
            "local>hayden/renovate-config",
          ]
        }
    - name: RENOVATE_ONBOARDING_CONFIG_FILE_NAME
      value: renovate.json5
    - name: RENOVATE_REBASE_WHEN
      value: behind-base-branch
    - name: RENOVATE_AUTOMERGE_STRATEGY
      value: fast-forward
    - name: RENOVATE_GIT_IGNORED_AUTHORS
      value: '["gitbot@hayden.moe", "214498265+phoebe-bot[bot]@users.noreply.github.com"]'
  provider:
    name: forgejo
    endpoint: https://forgejo.hayden.moe/api/v1
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-webhook
        key: webhook
    sync:
      enabled: true
      secretRef:
        name: renovate-webhook
        key: webhook
