---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-cert-upload
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      unifi-cert-upload:
        type: cronjob
        cronjob:
          schedule: "0 */4 * * *"
          failedJobsHistory: 3
          successfulJobsHistory: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/infra: "true"
            egress.policy.home.arpa/internet: "true"
        containers:
          app:
            image:
              repository: mirror.gcr.io/rockylinux/rockylinux
              tag: 10@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
            command:
              - /bin/bash
              - /scripts/upload.sh
            env:
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: unifi-cert-upload-secret
            securityContext:
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      certs:
        type: secret
        name: hayden-moe-tls
        defaultMode: 0o600
      scripts:
        type: configMap
        name: unifi-cert-upload-script
        globalMounts:
          - path: /scripts
            readOnly: true
