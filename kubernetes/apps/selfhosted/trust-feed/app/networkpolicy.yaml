---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-feed
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-feed
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: miniflux
            io.kubernetes.pod.namespace: selfhosted
        - matchLabels:
            app.kubernetes.io/name: gatus
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miniflux-trust-feed
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: trust-feed
            io.kubernetes.pod.namespace: selfhosted
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
