---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust-feed
  annotations:
    secret.reloader.stakater.com/reload: trust-feed-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trust-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trust-feed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          command: [nginx]
          args: [-c, /config/nginx.conf, -g, "daemon off;"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: trust-feed
        - name: tls
          secret:
            secretName: trust-feed-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
