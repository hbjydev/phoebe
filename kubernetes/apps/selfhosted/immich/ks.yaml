---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace selfhosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/postgres/pass
    - ../../../../components/kopiur
    - ../../../../components/kanidm/private
    - ../../../../components/redis
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/selfhosted/immich/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace

      KOPIUR_CAPACITY: 32Gi
      KOPIUR_UID: '0'
      KOPIUR_GID: '0'
      KOPIUR_PRIVILEGED_MODE: "true"
      KOPIUR_RUN_AS_NON_ROOT: "false"

      OIDC_DISPLAY_NAME: Immich
      OIDC_ORIGIN: https://photos.hayden.moe/
      OIDC_REDIRECT_URLS: '["app.immich:///oauth-callback", "https://photos.hayden.moe/auth/login", "https://photos.hayden.moe/user-settings"]'
      OIDC_GROUP_PREFIX: immich
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_CLAIM_MAP: '[{name: immich_role, valuesMap: [{group: immich_users, values: [user]}, {group: immich_admins, values: [admin]}]}]'

      DATABASE_EXTENSIONS: |
        [
          { name: vector },
          { name: vchord },
          { name: earthdistance },
          { name: cube },
        ]
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
