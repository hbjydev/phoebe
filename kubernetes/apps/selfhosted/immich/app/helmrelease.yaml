---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.13.4
  url: oci://ghcr.io/immich-app/immich-charts/immich
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        pod:
          labels:
            egress.policy.home.arpa/internet: allow
            db.policy.home.arpa/postgres: allow
            db.policy.home.arpa/df-immich-redis: allow
        containers:
          main:
            image:
              # renovate: datasource=github-releases depName=immich-app/immich
              tag: v3.3.5
            env:
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-postgres
                    key: url

              REDIS_HOSTNAME: ${APP}-redis.selfhosted.svc.cluster.local
              REDIS_PORT: 6379
              REDIS_DBINDEX: 0

    immich:
      metrics:
        enabled: false
      persistence:
        library:
          existingClaim: immich

    server:
      persistence:
        dev-dri:
          type: hostPath
          hostPath: /dev/dri
        dev-kfd:
          type: hostPath
          hostPath: /dev/kfd

    machine-learning:
      enabled: true
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          storageClass: miroir-local
        dev-dri:
          type: hostPath
          hostPath: /dev/dri
        dev-kfd:
          type: hostPath
          hostPath: /dev/kfd
