---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: apps-to-searxng
spec:
  endpointSelector:
    matchLabels:
      egress.policy.home.arpa/searxng: allow
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng
            io.kubernetes.pod.namespace: selfhosted
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            egress.policy.home.arpa/searxng: allow
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
