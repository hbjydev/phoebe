---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app paperless
  namespace: &namespace selfhosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/redis
    - ../../../../components/kanidm/private
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/selfhosted/paperless/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace

      OIDC_DISPLAY_NAME: Paperless
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/paperless-ngx.svg
      OIDC_ORIGIN: https://paperless.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://paperless.hayden.moe/accounts/oidc/kanidm/login/callback/"]'
      OIDC_GROUP_PREFIX: paperless
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
