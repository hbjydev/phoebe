---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      miniflux:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
            egress.policy.home.arpa/postgres: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: miniflux/miniflux
              tag: 2.3.3-distroless@sha256:59e4e31b349f008ecd34b547f23498b1d8abc0c03d5f6d12bdb713ab7f7c04bf
            env:
              TZ: Europe/London

              DATABASE_URL:
                secretKeyRef:
                  name: miniflux-postgres
                  key: url
              RUN_MIGRATIONS: '1'

              TRUSTED_REVERSE_PROXY_NETWORKS: '172.18.0.0/16'

              DISABLE_LOCAL_AUTH: '1'
              OAUTH2_PROVIDER: oidc
              OAUTH2_CLIENT_ID:
                secretKeyRef:
                  name: miniflux-kanidm-oauth2-credentials
                  key: CLIENT_ID
              OAUTH2_CLIENT_SECRET:
                secretKeyRef:
                  name: miniflux-kanidm-oauth2-credentials
                  key: CLIENT_SECRET
              OAUTH2_USER_CREATION: '1'
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: 'https://sso.hayden.moe/oauth2/openid/miniflux'
              OAUTH2_OIDC_PROVIDER_NAME: 'Hayden.moe SSO'
              OAUTH2_REDIRECT_URL: 'https://miniflux.hayden.moe/oauth2/oidc/callback'
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1024Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: *port
          metrics:
            port: 9090

    serviceMonitor:
      app:
        enabled: true
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hayden.moe"
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
