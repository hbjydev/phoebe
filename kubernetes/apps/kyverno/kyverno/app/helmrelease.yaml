---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 1h
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admissionController:
      replicas: 1
      podLabels:
        ingress.policy.home.arpa/apiserver: allow
        egress.policy.home.arpa/apiserver: allow
    backgroundController:
      enabled: false
    cleanupController:
      enabled: false
    reportsController:
      enabled: false
    features:
      admissionReports:
        enabled: false
      backgroundScan:
        enabled: false
    config:
      excludeKyvernoNamespace: true
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
                - cert-manager
