---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pkg.crossplane.io/provider_v1.json
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-cloudplatform
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-cloudplatform:v3.0.1
  runtimeConfigRef:
    name: provider-gcp-cloudplatform
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/pkg.crossplane.io/deploymentruntimeconfig_v1beta1.json
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-gcp-cloudplatform
spec:
  serviceAccountTemplate:
    metadata:
      name: cp-gcp-cloudplatform

  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              env:
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /etc/gcp/credential-configuration.json
              volumeMounts:
                - name: gcp-wif-config
                  mountPath: /etc/gcp
                  readOnly: true
          volumes:
            - name: gcp-wif-config
              secret:
                secretName: crossplane-gcp-wif
                items:
                  - key: credential-configuration.json
                    path: credential-configuration.json
---
