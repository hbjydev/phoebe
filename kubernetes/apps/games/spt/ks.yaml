---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app spt
  namespace: &namespace games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: spt
  interval: 1h
  components:
    - ../../../../components/kopiur
  path: "./kubernetes/apps/games/spt/app"
  prune: true
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_CAPACITY: 5Gi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
