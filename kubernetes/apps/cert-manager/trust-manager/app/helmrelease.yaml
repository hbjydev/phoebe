---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trust-manager
  values:
    defaultPackageImage:
      repository: quay.io/jetstack/trust-pkg-debian-trixie
      tag: 20250419-deb13u1.0@sha256:0591b21e1dd3e649660f80d89d44bbfa6a16e8b305612339f7d093857d852cf8

    secretTargets:
      enabled: true
      authorizedSecrets:
        - root-ca
        - postgres-client-ca

    app:
      trust:
        namespace: cert-manager
