---
# Keeps `lvs` from opening /dev/rbd* inside Rook OSD pods.
#
# `ceph-volume raw activate` shells out to `lvs`, which opens every block
# device on the host. While osd.0 is down, reading a mapped rbd device blocks
# forever in the kernel (D state, folio_wait_writeback), because the OSD that
# would serve that read is the one trying to start. Deadlock.
#
# Rook 1.21 also filters LVM scans, but Ceph v20.2.4 raw activation probes
# every lsblk device for LUKS before using --device. That Python read can
# deadlock on /dev/rbd0 independently of LVM. Skip RBD and CSI encrypted RBD
# mappings before the encryption probe. Patch only the container's Python
# module; the OSD disk and host files are not modified by this workaround.
# Keep this at pod admission because Rook regenerates OSD Deployments.
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: rook-osd-lvm-rbd-filter
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: has-unfiltered-activate-container
      expression: >-
        has(object.spec.initContainers) &&
        object.spec.initContainers.exists(c,
          c.name == "activate" &&
          has(c.command) && c.command.size() == 3 &&
          !c.command[2].contains("global_filter"))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          [0, 1, 2, 3, 4, 5, 6, 7]
            .filter(i,
              i < object.spec.initContainers.size() &&
              object.spec.initContainers[i].name == "activate" &&
              has(object.spec.initContainers[i].command) &&
              object.spec.initContainers[i].command.size() == 3 &&
              !object.spec.initContainers[i].command[2].contains("global_filter"))
            .map(i, JSONPatch{
              op: "replace",
              path: "/spec/initContainers/" + string(i) + "/command/2",
              value: "echo 'devices { global_filter = [ \"r|^/dev/rbd|\", \"r|^/dev/nbd|\", \"r|^/dev/drbd|\", \"r|^/dev/zram|\" ] }' >> /etc/lvm/lvm.conf\n"
                + "python3 - <<'PYROOK'\nimport inspect\nfrom pathlib import Path\nfrom ceph_volume import objectstore\np = Path(inspect.getfile(objectstore.mapping['RAW']['bluestore']))\ns = p.read_text()\nneedle = \"            device: str = d.get('NAME', '')\\n\"\nreplacement = needle + \"            if device.startswith(('/dev/rbd', '/dev/mapper/luks-rbd-')):\\n                continue\\n\"\nif replacement not in s:\n    if s.count(needle) != 1:\n        raise RuntimeError('Ceph raw activation changed; review RBD scan workaround')\n    patched = s.replace(needle, replacement)\n    compile(patched, str(p), 'exec')\n    p.write_text(patched)\nPYROOK\n"
                + object.spec.initContainers[i].command[2]
            })
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: rook-osd-lvm-rbd-filter
spec:
  policyName: rook-osd-lvm-rbd-filter
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: rook-ceph
    objectSelector:
      matchLabels:
        app: rook-ceph-osd
