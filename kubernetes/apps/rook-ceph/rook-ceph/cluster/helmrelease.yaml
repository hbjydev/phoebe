---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.hayden.moe
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: internal
            namespace: network
    # Pin the Ceph image explicitly. Left unset, the chart default decides it,
    # and those defaults differ per chart revision (v1.19.2 -> v19.2.3,
    # v1.20.7 -> v20.2.4). A failed Helm upgrade that rolls back to an older
    # chart therefore silently proposes a Ceph *downgrade*. Rook refuses to
    # reconcile at all in that state, which times out the next Helm upgrade,
    # which rolls back again. That loop is what wedged this cluster.
    #
    # Must be >= the running version; Rook does not support downgrades. Note
    # the chart renders cephVersion from this block, so do NOT also set
    # cephClusterSpec.cephVersion or the CephCluster gets a duplicate key.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
      allowUnsupported: false
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-victoria-metrics.observability.svc:8428
      mgr:
        count: 1
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      mon:
        count: 1
        allowMultiplePerNode: true
      network:
        provider: host
        addressRanges:
          public: []
          cluster: []
        connections:
          requireMsgr2: true
      resources:
        osd:
          limits:
            memory: 4Gi
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            # Rook has already rotated daemon keys to generation 3 (see
            # CephCluster status.cephx). The CRD rejects any decrease with
            # "keyGeneration cannot be decreased", which fails the Helm
            # upgrade, which triggers the rollback that downgrades Ceph.
            # Only ever raise this number.
            keyGeneration: 3
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/disk/by-id/nvme-CT1000P3PSSD8_25044DD0CC34_.*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 1
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems: []
    cephObjectStores: []
