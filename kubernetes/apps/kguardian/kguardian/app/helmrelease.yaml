---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
spec:
  chartRef:
    kind: OCIRepository
    name: kguardian
  interval: 30m
  values:
    controller:
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

      excludedNamespaces:
        - kguardian

    database:
      enabled: false
      user: kguardian
      databaseName: kguardian
      existingSecret: kguardian-postgres
      passwordSecretKey: password
      external:
        host: postgres-rw.database.svc.cluster.local
        port: 5432
        sslMode: disable

    ai:
      enabled: true
      provider: openai
      secret: kguardian-litellm
      baseUrl: http://litellm.ai.svc.cluster.local:4000
      model: chatgpt/gpt-5.6-luna
