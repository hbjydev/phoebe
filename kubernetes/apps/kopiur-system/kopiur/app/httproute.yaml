---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: kopiur-ui
  namespace: kopiur-system
spec:
  credentialInjection:
    header: X-Kopiur-Proxy-Token
    overwrite: true
    credential:
      valueRef:
        name: kopiur-ui-proxy-token

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopiur-ui
  namespace: kopiur-system
spec:
  parentRefs:
    - name: external
      namespace: network
      sectionName: https
  hostnames:
    - kopiur.hayden.moe
  rules:
    - backendRefs:
        - name: kopiur-ui
          port: 8090
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: kopiur-ui
