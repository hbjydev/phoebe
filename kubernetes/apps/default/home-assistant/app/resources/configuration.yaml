---
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.18.0.0/16
    - 10.80.0.0/24

# Loads default set of integrations. Do not remove.
default_config:

# Metrics
prometheus:
  namespace: hass
  filter:
    include_entity_globs:
      - sensor.octopus_energy_electricity_*
      - update.*

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/material-you-utilities/material-you-utilities.min.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

google_assistant:
  project_id: hy-home-assistant-0f149
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true
  exposed_domains:
    - switch
    - light
    - fan

panel_custom:
  - name: material-you-panel
    url_path: material-you-configuration
    sidebar_title: Material You Utilities
    sidebar_icon: mdi:material-design
    module_url: /hacsfiles/material-you-utilities/material-you-utilities.min.js
