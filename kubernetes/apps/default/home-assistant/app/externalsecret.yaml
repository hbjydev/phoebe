---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-scrape
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hass-scrape
    template:
      data:
        token: "{{ .scrapeToken }}"
  dataFrom:
    - extract:
        key: app-home-assistant
