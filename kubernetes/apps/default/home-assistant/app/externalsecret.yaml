---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hass-scrape
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hass-scrape
    template:
      data:
        token: "{{ .scrapeToken }}"
  dataFrom:
    - extract:
        key: app-home-assistant
