---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      app:
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
            egress.policy.home.arpa/postgres: "true"
        containers:
          app:
            image:
              repository: ghcr.io/hbjydev/pinepods
              tag: pr-971-amd64@sha256:0d5c1fe0a427372ed2c61d34e265c9a716e76c6f4448fe00c03e3adc4b0f7994
            env:
              SEARCH_API_URL: https://search.pinepods.online/api/search
              PEOPLE_API_URL: https://people.pinepods.online
              HOSTNAME: 'https://pinepods.hayden.moe'

              DB_TYPE: postgresql
              DB_HOST:
                secretKeyRef:
                  name: pinepods-postgres
                  key: host
              DB_PORT: 5432
              DB_USER:
                secretKeyRef:
                  name: pinepods-postgres
                  key: username
              DB_PASSWORD:
                secretKeyRef:
                  name: pinepods-postgres
                  key: password
              DB_NAME:
                secretKeyRef:
                  name: pinepods-postgres
                  key: database
              DB_SSL_MODE: disable

              VALKEY_HOST: pinepods-redis
              VALKEY_PORT: 6379
              DEBUG_MODE: true

              TZ: Europe/London
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: app
        ports:
          http:
            port: 8040

    route:
      app:
        hostnames:
          - pinepods.hayden.moe
        parentRefs:
          - name: external
            namespace: network

    persistence:
      downloads:
        existingClaim: pinepods
        globalMounts:
          - path: /opt/pinepods/downloads
            subPath: downloads
          - path: /opt/pinepods/backups
            subPath: backups

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
