---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: madeofpendletonwool/pinepods
              tag: 0.9.0@sha256:ebc258bb0c62cdb69e5fb726b247c885dac19b50d06fed68fa8d37197b88ace4
            env:
              SEARCH_API_URL: https://search.pinepods.online/api/search
              PEOPLE_API_URL: https://people.pinepods.online
              HOSTNAME: 'https://pinepods.hayden.moe'

              DB_TYPE: postgresql
              DB_HOST:
                secretKeyRef:
                  name: pinepods-postgres
                  key: host
              DB_PORT: 5432
              DB_USER:
                secretKeyRef:
                  name: pinepods-postgres
                  key: username
              DB_PASSWORD:
                secretKeyRef:
                  name: pinepods-postgres
                  key: password
              DB_NAME:
                secretKeyRef:
                  name: pinepods-postgres
                  key: database

              VALKEY_HOST: pinepods-redis
              VALKEY_PORT: 6379
              DEBUG_MODE: false

              PUID: &uid 1000
              PGID: &gid 1000

              TZ: Europe/London
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: *uid
        runAsGroup: *gid
        fsGroup: *gid
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        ports:
          http:
            port: 8040

    route:
      app:
        hostnames:
          - pinepods.hayden.moe
        parentRefs:
          - name: external
            namespace: network

    persistence:
      downloads:
        existingClaim: pinepods
        globalMounts:
          - path: /opt/pinepods/downloads
            subPath: downloads
          - path: /opt/pinepods/backups
            subPath: backups
          - path: /opt/pinepods/local-media
            subPath: local-media
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /pinepods/cache
            subPath: cache
          - path: /opt/pinepods/certs
            subPath: certs
