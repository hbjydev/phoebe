---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: suwayomi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
            egress.policy.home.arpa/postgres: "true"
        containers:
          app:
            image:
              repository: ghcr.io/suwayomi/suwayomi-server
              tag: v2.3.2356@sha256:0724eb53d49cb6e629ffe28c96b41fe77471a7243b900aa2a3ac67bd8018ad6c
            env:
              TZ: Europe/London

              # Database
              DATABASE_TYPE: POSTGRESQL
              DATABASE_URL: postgresql://postgres-rw.database.svc:5432/suwayomi
              DATABASE_USERNAME:
                secretKeyRef:
                  name: suwayomi-postgres
                  key: username
              DATABASE_PASSWORD:
                secretKeyRef:
                  name: suwayomi-postgres
                  key: password

              # Cloudflare Bypass
              FLARESOLVERR_ENABLED: true
              FLARESOLVERR_URL: http://localhost:8191

              # Authentication
              AUTH_MODE: ui_login
              AUTH_USERNAME:
                secretKeyRef:
                  name: suwayomi-auth
                  key: username
              AUTH_PASSWORD:
                secretKeyRef:
                  name: suwayomi-auth
                  key: password

              EXTENSION_STORES: '["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]'
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/settings/about
                    port: &port 4567
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi

          flaresolverr:
            image:
              repository: ghcr.io/thephaseless/byparr
              tag: 3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
            env:
              TZ: Europe/London
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hayden.moe"
        parentRefs:
          - name: external
            namespace: network

    persistence:
      media:
        type: nfs
        server: ds.hayden.moe
        path: /volume1/media
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk
            subPath: apps/suwayomi
      dev-dri:
        type: hostPath
        hostPath: /dev/dri
      dev-kfd:
        type: hostPath
        hostPath: /dev/kfd
      tmp:
        type: emptyDir
