---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name suwayomi-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: app-suwayomi
