---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app silo
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
    - ../../../../components/kanidm/private
    - ../../../../components/postgres/cert
    - ../../../../components/redis
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/media/silo/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace

      KOPIUR_CAPACITY: 10Gi
      KOPIUR_UID: "0"
      KOPIUR_GID: "0"
      KOPIUR_PRIVILEGED_MODE: "true"
      KOPIUR_RUN_AS_NON_ROOT: "false"

      OIDC_DISPLAY_NAME: Silo
      OIDC_ORIGIN: https://silo.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://silo.hayden.moe/api/v2/auth/oauth/5/callback"]'
      OIDC_GROUP_PREFIX: silo
      OIDC_USERS_GROUP_MEMBERS: '[hayden, invisible]'
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
      OIDC_PREFER_SHORT_USERNAME: 'true'

      DATABASE_EXTENSIONS: '[{ name: vector }]'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
