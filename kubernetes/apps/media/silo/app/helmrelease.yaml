---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      silo:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
            db.policy.home.arpa/postgres: allow
            db.policy.home.arpa/df-silo-redis: allow
        containers:
          app:
            image:
              repository: ghcr.io/silo-server/silo-server
              tag: build-1626@sha256:251676244b2b2339b2142714a11a41a5e096b23dd4ccee987edd6c4fefe5dd41
            env:
              TZ: Europe/London
              PORT: "8080"
              JF_PORT: "8096"
              DATABASE_URL:
                secretKeyRef:
                  name: ${APP}-postgres
                  key: url
              REDIS_URL: redis://${APP}-redis.media.svc.cluster.local
              SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
              POSTGRES_TUNE: auto
              MEDIA_CONTAINER_ROOT: /mnt/media
            envFrom:
              - secretRef:
                  name: ${APP}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
              privileged: true
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 6Gi

    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.20.24/24"],
            "mac": "c6:07:27:af:fb:25"
          }]

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 401"]
        hostnames:
          - "{{ .Release.Name }}.hayden.moe"
        parentRefs:
          - name: external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - subPath: plugins
            path: /var/lib/silo/plugins
          - subPath: artwork
            path: /var/lib/silo/artwork
          - subPath: compat
            path: /var/lib/silo/compat

      cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - subPath: transcode
            path: /tmp/silo-transcode
          - subPath: download-artifacts
            path: /tmp/silo-download-artifacts
          - subPath: catalog-seeds
            path: /catalog-seeds

      media:
        type: nfs
        server: ds.hayden.moe
        path: /volume1/media
        globalMounts:
          - path: /mnt/media

      dev-dri:
        type: hostPath
        hostPath: /dev/dri

      dev-kfd:
        type: hostPath
        hostPath: /dev/kfd

      tmp:
        type: emptyDir
