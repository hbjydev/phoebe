---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-operator
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: litellm-operator
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 5m

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  dependsOn:
    - name: litellm-operator
  components:
    - ../../../../components/kopiur
    - ../../../../components/kanidm/private
    - ../../../../components/postgres/pass
  path: ./kubernetes/apps/ai/litellm/app
  prune: true
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      KOPIUR_CAPACITY: 1Gi

      OIDC_DISPLAY_NAME: LiteLLM
      OIDC_ALLOW_INSECURE_CLIENT_DISABLE_PKCE: 'true'
      OIDC_ORIGIN: https://llm.hayden.moe/
      OIDC_REDIRECT_URLS: '["https://llm.hayden.moe/sso/callback"]'
      OIDC_GROUP_PREFIX: litellm
      OIDC_USERS_GROUP_MEMBERS: '[hayden]'
      OIDC_ADMIN_GROUP_MEMBERS: '[hayden]'
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
