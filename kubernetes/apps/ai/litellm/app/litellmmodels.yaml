# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: dsv4f
spec:
  modelName: deepseek-v4-flash
  params:
    model: openai/deepseek-v4-flash
    apiBase: https://hyper.charm.land/v1
    apiKey: os.environ/CHARM_HYPER_API_KEY
    additional:
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 1310722
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: false
    extra:
      input_cost_per_token: 2e-7
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 4e-8
      output_cost_per_token: 4e-7

