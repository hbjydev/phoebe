---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-context7
spec:
  alias: context7
  url: https://mcp.context7.com/mcp
  transport: http
  params:
    available_on_public_internet: true
  authType: bearer_token
  authTokenRef:
    name: context7-api-key
    key: token

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-kguardian
spec:
  alias: kguardian
  url: http://kguardian-llm-bridge.kguardian.svc.cluster.local:8080/mcp
  transport: http
  params:
    available_on_public_internet: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-hass
spec:
  alias: hass
  params:
    available_on_public_internet: true
  workload:
    # renovate: datasource=docker depName=ghcr.io/homeassistant-ai/ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:8.4.3
    port: 8086
    command: ["ha-mcp-web"]
    env:
      - name: HOMEASSISTANT_URL
        value: https://hass.hayden.moe
      - name: HOMEASSISTANT_TOKEN
        valueFrom:
          secretKeyRef:
            name: homeassistant-token
            key: token
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: mcp-miniflux
spec:
  alias: miniflux
  params:
    available_on_public_internet: true
  transport: stdio
  workload:
    # renovate: datasource=docker depName=jwonder/miniflux-mcp
    image: jwonder/miniflux-mcp:0.7.0
    env:
      - name: MINIFLUX_URL
        value: http://miniflux.selfhosted.svc.cluster.local:8080
      - name: MCP_TRANSPORT
        value: stdio
      - name: MINIFLUX_API_KEY
        valueFrom:
          secretKeyRef:
            name: miniflux-token
            key: token
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
