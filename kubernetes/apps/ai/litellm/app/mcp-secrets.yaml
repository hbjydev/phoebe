---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context7-api-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: context7-api-key
    template:
      data:
        CONTEXT7_API_KEY: '{{ .context7Token }}'
  dataFrom:
    - extract:
        key: mcp-context7
