---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context7-api-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: context7-api-key
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: mcp-context7
        property: token
