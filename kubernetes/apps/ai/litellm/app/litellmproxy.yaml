---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.100.0@sha256:c8756e7b9a61fe45df2ccb5b781d388c3b2f3a21ef9e4956630caef20f9f03aa
  replicas: 1

  applyMode: api
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    health_check_endpoint: /v1/health

  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600

  litellmSettings:
    callbacks:
      - /opt/litellm-compat/chatgpt_stream_recovery.proxy_handler_instance
    success_callback: ["prometheus"]
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
    set_verbose: false

  podAnnotations:
    reloader.stakater.com/auto: "true"

  volumes:
    - configMap:
        name: litellm-chatgpt-compat
      name: chatgpt-compat
    - name: data
      persistentVolumeClaim:
        claimName: litellm

  volumeMounts:
    - name: data
      mountPath: /app/chatgpt_tokens
      subPath: chatgpt-tokens
    - name: chatgpt-compat
      mountPath: /opt/litellm-compat
      readOnly: true

  envFrom:
    - secretRef:
        name: litellm-secret

  env:
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens

    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-postgres
          key: url

    - name: LITELLM_LOG
      value: INFO

    - name: REDIS_HOST
      value: dragonfly.database.svc

    - name: REDIS_PORT
      value: "6379"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi

  service:
    type: ClusterIP
    port: 4000

  route:
    hostnames:
      - llm.hayden.moe
    parentRefs:
      - name: external
        namespace: network
