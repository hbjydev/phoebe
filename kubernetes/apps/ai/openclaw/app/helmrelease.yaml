---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      openclaw:
        replicas: 1
        strategy: Recreate
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostname: openclaw
          labels:
            ingress.policy.home.arpa/internal: allow
            egress.policy.home.arpa/internet: allow
            egress.policy.home.arpa/litellm: allow
            egress.policy.home.arpa/memini: allow
        serviceAccount:
          identifier: openclaw
        containers:
          app:
            image: &img
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.4@sha256:cc596b846506a5f4cfcee111394a2725f375f01cca2ebb492a161fd1b747f101
            env: &env
              TZ: Europe/London
              OPENCLAW_LOG_LEVEL: debug
              BROWSER_WS_ENDPOINT: ws://localhost:9222
              AAA_HOME: &pvc /home/openclaw
              HOME: *pvc
              OPENCLAW_HOME: *pvc
              GOPATH: "$(AAA_HOME)/go"
              OPENCLAW_GATEWAY_PORT: &port 8080
              OPENCLAW_GATEWAY_BIND: 0.0.0.0
              PATH: "$(AAA_HOME)/.local/bin:$(AAA_HOME)/.local/share/mise/shims:$(AAA_HOME)/.local/go/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              TERM: xterm-256color
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
            envFrom: &envFrom
              - secretRef:
                  name: openclaw-secret
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 8Gi
            ports:
              - containerPort: *port
                name: gateway
                protocol: TCP
            securityContext: &secCtx
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  periodSeconds: 1
                  failureThreshold: 3600
        initContainers:
          setup:
            image: *img
            command:
              - sh
              - -c
              - |
                done_file="$(AAA_HOME)/.openclaw/.setup-complete"

                while [ ! -f "$${done_file}" ]; do
                  echo 'OpenClaw setup is incomplete; exec to this container and run `openclaw setup && touch $(AAA_HOME)/.openclaw/.setup-complete`.';
                  sleep 5;
                done;
            env: *env
            envFrom: *envFrom
            securityContext: *secCtx

    defaultPodOptions:
      automountServiceAccountToken: true
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: openclaw
        ports:
          gateway:
            port: 8080

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.hayden.moe"
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: gateway

    persistence:
      data:
        existingClaim: '{{ .Release.Name }}'
        globalMounts:
          - subPath: data
            path: *pvc

      misc:
        existingClaim: openclaw-misc
        globalMounts:
          - subPath: brew
            path: /home/linuxbrew
          - subPath: go
            path: /home/openclaw/go
          - subPath: go-local
            path: /home/openclaw/.local/go
          - subPath: mise
            path: /home/openclaw/.local/share/mise

      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    serviceAccount:
      openclaw: {}
