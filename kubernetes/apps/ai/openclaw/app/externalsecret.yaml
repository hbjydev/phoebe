---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openclaw-secret
    template:
      data:
        OPENCLAW_GATEWAY_PASSWORD: '{{ .password }}'
  dataFrom:
    - extract:
        key: app-openclaw
