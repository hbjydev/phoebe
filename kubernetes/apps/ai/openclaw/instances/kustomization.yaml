---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: cortana
      app.kubernetes.io/instance: cortana
      app.kubernetes.io/controller: cortana
    includeSelectors: true
resources:
  - ./instance.yaml
  - ./httproute.yaml
  - ./rbac.yaml

configMapGenerator:
  - name: mimi-mise-config
    files:
      - mise.toml
