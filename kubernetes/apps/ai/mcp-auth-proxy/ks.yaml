---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mcp-auth-proxy
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kanidm/private
  dependsOn:
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/mcp-auth-proxy/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      OIDC_DISPLAY_NAME: ChatGPT MCP gateway
      OIDC_IMAGE_URL: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/openai.svg
      OIDC_ORIGIN: https://mcp.hayden.moe
      OIDC_REDIRECT_URLS: '["https://mcp.hayden.moe/.auth/oidc/callback"]'
      OIDC_SECRET_ROTATION_ENABLED: "false"
      OIDC_GROUP_PREFIX: mcp_auth_proxy
      OIDC_USERS_GROUP_MEMBERS: '[hayden]'
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
