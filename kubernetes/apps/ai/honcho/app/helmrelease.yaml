---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: honcho
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      honcho:
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: cluster-roots
        pod:
          labels:
            trust.home.arpa/inject: "true"
            ingress.policy.home.arpa/internal: allow
            db.policy.home.arpa/postgres: allow
            db.policy.home.arpa/df-honcho-redis: allow
            egress.policy.home.arpa/litellm: allow
            egress.policy.home.arpa/internet: allow
        containers:
          app:
            image: &img
              repository: ghcr.io/plastic-labs/honcho
              tag: v3.6.0@sha256:eb906a2d251aa48b22347e4465b40785ea7a84e2bfd1105780416bf1f0121099
            command:
              - /bin/sh
              - -c
            args:
              - |
                cd /app
                /app/.venv/bin/python scripts/provision_db.py
                /app/.venv/bin/python scripts/configure_embeddings.py --yes
                exec /app/.venv/bin/fastapi run --host 0.0.0.0 src/main.py
            env: &env
              # Authentication
              AUTH_USE_AUTH: "false"

              # Caching
              CACHE_ENABLED: "true"
              CACHE_URL: redis://honcho-redis.ai.svc.cluster.local:6379/0?suppress=true

              # Embeddings
              EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: never
              EMBEDDING_MODEL_CONFIG__MODEL: qwen3-embedding-0.6b
              EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: LLM_OPENAI_API_KEY
              EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
              EMBEDDING_VECTOR_DIMENSIONS: "1024"

              # LLMs
              LLM_OPENAI_API_KEY:
                secretKeyRef:
                  name: honcho-litellm
                  key: api-key
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1

              # Telemetry
              TELEMETRY_ENABLED: "false"

              # Database
              DB_CONNECTION_URI: "postgresql+psycopg://honcho@pooler-rw.database.svc:5432/honcho?sslmode=verify-full&sslcert=/var/run/secrets/postgresql/tls.crt&sslkey=/var/run/secrets/postgresql/tls.key&sslrootcert=/var/run/cluster-trust/ca.crt"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &hcPort 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

          deriver:
            image: *img
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                cd /app
                exec /app/.venv/bin/python -m src.deriver
            env: *env
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi

          openconcho:
            image:
              repository: ghcr.io/offendingcommit/openconcho-web
              tag: 0.17.1@sha256:62dc58ba22e533bb795021c80cfcc101c3a260c670accdb8e27bdc46a176fd2c
            env:
              OPENCONCHO_DEFAULT_HONCHO_URL: http://127.0.0.1:8000
              OPENCONCHO_UPSTREAM_ALLOWLIST: 127.0.0.1
              TZ: Europe/Warsaw
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &ocPort 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      annotations: {}
      labels: {}
      schedulingGates: []
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault


    service:
      app:
        controller: honcho
        ports:
          http:
            port: 80
            targetPort: *hcPort
      openconcho:
        controller: honcho
        ports:
          http:
            port: *ocPort

    route:
      app:
        hostnames:
          - "honcho.hayden.moe"
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - name: app
            backendRefs:
              - kind: Service
                name: honcho-openconcho
                port: *ocPort
            matches:
              - path:
                  type: PathPrefix
                  value: /

    persistence:
      postgres-certs:
        type: custom
        advancedMounts:
          honcho:
            app:
              - path: /var/run/secrets/postgresql
                readOnly: true
            deriver:
              - path: /var/run/secrets/postgresql
                readOnly: true
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-client-ca
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/key-usages: client auth
              csi.cert-manager.io/common-name: honcho
              csi.cert-manager.io/fs-group: "1000"
      config:
        type: configMap
        name: honcho-configmap
        globalMounts:
          - subPath: config.toml
            path: /app/config.toml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
