---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memini
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      fullnameOverride: memini

    controllers:
      main:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: cluster-roots
        pod:
          labels:
            trust.home.arpa/inject: "true"
            db.policy.home.arpa/postgres: allow
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: postgres
              MEMINI_POSTGRES_DSN: "postgresql://memini@pooler-rw.database.svc:5432/memini?sslmode=verify-full&sslcert=/var/run/secrets/postgresql/tls.crt&sslkey=/var/run/secrets/postgresql/tls.key&sslrootcert=/var/run/cluster-trust/ca.crt"
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_TOMBSTONE_TTL: 720h
              MEMINI_LOG_FORMAT: json
              MEMINI_EMBED_BASE_URL: http://text-embeddings-inference.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_DIMS: '384'
              MEMINI_EMBED_MODEL: all-MiniLM-L6-v2
              MEMINI_RERANK: http://llama-cpp-reranker.ai.svc.cluster.local:8080/v1
              MEMINI_RERANK_MODEL: qwen3-reranker-0.6b
              MEMINI_RERANK_TOP_N: '20'
              MEMINI_RERANK_MAX_DOC_CHARS: '4000'
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }

    persistence:
      postgres-certs:
        type: custom
        globalMounts:
          - path: /var/run/secrets/postgresql
            readOnly: true
        volumeSpec:
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: postgres-client-ca
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/key-algorithm: ECDSA
              csi.cert-manager.io/key-size: "384"
              csi.cert-manager.io/key-encoding: PKCS8
              csi.cert-manager.io/key-usages: client auth
              csi.cert-manager.io/common-name: memini
              csi.cert-manager.io/fs-group: "1000"
      data:
        existingClaim: memini

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true

    route:
      main:
        enabled: true
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        hostnames:
          - memini.hayden.moe

      ui:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: 'false'
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        hostnames:
          - memini.hayden.moe
