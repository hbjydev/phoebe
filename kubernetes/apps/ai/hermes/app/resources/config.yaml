---
custom_providers:
  - name: litellm
    key_env: LITELLM_API_KEY
    base_url: http://litellm.ai.svc.cluster.local:4000
    models:
      gpt-5.6-luna:
        context_length: 272000
      gpt-5.6-terra:
        context_length: 272000
      gpt-5.6-sol:
        context_length: 272000
      gpt-6-astra:
        context_length: 272000

model:
  default: gpt-6-luna
  provider: custom:litellm
  context_length: 272000

model_aliases:
  luna:
    model: gpt-6-luna
    provider: custom:litellm
  terra:
    model: gpt-5.6-terra
    provider: custom:litellm
  sol:
    model: gpt-6-sol
    provider: custom:litellm
  astra:
    model: gpt-6-astra
    provider: custom:litellm

memory:
  provider: honcho

honcho: {}

terminal:
  backend: local
  cwd: /data/workspace
  timeout: 900
  lifetime_seconds: 1800
  persistent_shell: true

timeouts:
  tools:
    concurrent_batch: 900

compression:
  enabled: true
  protect_last_n: 20
  threshold: 0.5

streaming:
  enabled: false

approvals:
  mode: smart
  timeout: 60
  cron_mode: deny

security:
  redact_secrets: true
  webiste_blocklist:
    enabled: true
    domains:
      - "169.254.169.254"
      - "metadata.google.internal"

privacy:
  redact_pii: true

agent:
  max_turns: 150
  gateway_timeout: 1800
  gateway_timeout_warning: 900
  restart_drain_timeout: 60
  api_max_retries: 3
  reasoning_effort: medium

gateway:
  multiplex_profiles: true
  profile_routes:
    - # Home Server -> Holly
      name: home-server
      platform: discord
      guild_id: "1394013827573743727"
      profile: default

    - # Personal Server -> Chat Channel -> Mimi
      name: personal-server-chat
      platform: discord
      guild_id: "1363571384193912943"
      chat_id: "1552319412386795540"
      profile: mimi

    - # Personal Server -> Ops Channel -> Ops Agent
      name: personal-server-ops
      platform: discord
      guild_id: "1363571384193912943"
      chat_id: "1552319427813449799"
      profile: ops

    - # Personal Server -> Coding Channel -> Coder Agent
      name: personal-server-coding
      platform: discord
      guild_id: "1363571384193912943"
      chat_id: "1552319441017118770"
      profile: coder

delegation:
  model: gpt-5.6-luna
  max_concurrent_children: 6
  max_spawn_depth: 2

moa:
  default_preset: council
  presets:
    council:
      enabled: true
      reference_models:
        - provider: custom:litellm
          model: gpt-6-luna
        - provider: custom:litellm
          model: gpt-5.6-terra
      aggregator:
        provider: custom:litellm
        model: gpt-5.6-terra
      max_tokens: 8192

mcp_servers:
  all:
    url: http://litellm.ai.svc.cluster.local:4000/mcp
    headers:
      Authorization: "Bearer ${LITELLM_API_KEY}"

  mimi:
    url: http://litellm.ai.svc.cluster.local:4000/toolset/mimi/mcp
    headers:
      Authorization: "Bearer ${LITELLM_API_KEY}"

  ops:
    url: http://litellm.ai.svc.cluster.local:4000/toolset/observability/mcp
    headers:
      Authorization: "Bearer ${LITELLM_API_KEY}"

web:
  search_backend: searxng

discord:
  require_mention: true
  auto_thread: true
  reactions: true
  allowed_channels: "*"
