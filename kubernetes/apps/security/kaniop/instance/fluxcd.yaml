---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kanidm-git
spec:
  interval: 1h
  url: https://github.com/hbjydev/kanidm-auth-objects.git
  ref:
    name: refs/heads/main
  secretRef:
    name: kanidm-git-auth
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-git
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: kanidm-git
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-git-auth
spec:
  target:
    name: kanidm-git-auth
    template:
      data:
        username: token
        password: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: github-auth-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/notification.toolkit.fluxcd.io/receiver_v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: kanidm-git-auth-webhook
spec:
  type: github
  events: ["ping", "push"]
  secretRef:
    name: kanidm-git-auth-webhook-token-secret
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: kanidm-git
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: kanidm-git
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-git-auth-webhook-token-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kanidm-git-auth-webhook-token-secret
    template:
      data:
        token: "{{ .password }}"
  dataFrom:
    - extract:
        key: app-flux-webhook-kanidm
