---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kaniop.rs/kanidm_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  domain: sso.hayden.moe
  ldapPortName: ldaps
  image: kanidm/server:1.12.0
  disableUpgradeChecks: true

  domainAppearance:
    displayName: Hayden's SSO
    image:
      url: https://github.com/hbjydev.png

  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      statefulSetAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 100m
          memory: 140Mi
        limits:
          memory: 512Mi

  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: miroir-local
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 512Mi

  # Selectors
  oauth2ClientNamespaceSelector:
    matchLabels: {}
  groupNamespaceSelector:
    matchLabels: {}
  personNamespaceSelector:
    matchLabels: {}
  serviceAccountNamespaceSelector:
    matchLabels: {}
